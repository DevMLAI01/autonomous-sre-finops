name: CI Pipeline – Autonomous SRE FinOps

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install lint dependencies
        run: pip install ruff mypy boto3 langgraph qdrant-client
      - name: Run Ruff linter
        run: ruff check . --output-format=github
      - name: Run Ruff formatter check
        run: ruff format --check .

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
      LANGCHAIN_TRACING_V2: "false"
      AWS_ACCESS_KEY_ID: "test-key"
      AWS_SECRET_ACCESS_KEY: "test-secret"
      AWS_DEFAULT_REGION: "us-east-1"
      GITHUB_TOKEN: ${{ secrets.GH_PAT }}
      QDRANT_URL: "http://localhost:6333"
      QDRANT_API_KEY: "test-key"
      CPU_UTILIZATION_THRESHOLD: "5.0"
      MONTHLY_COST_THRESHOLD: "100"
      LOOKBACK_DAYS: "7"
    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov pytest-mock pytest-asyncio moto[ec2,cloudwatch]
      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=agents \
            --cov=rag \
            --cov=graph \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=60 \
            -v \
            --asyncio-mode=auto
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
